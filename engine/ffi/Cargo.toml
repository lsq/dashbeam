[package]
name = "dashbeam-ffi"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.91"

[lib]
name = "dashbeam_ffi"
crate-type = ["cdylib"]

[dependencies]
native = { path = "../native", package = "sendme-native" }
protocol = { path = "../protocol", package = "sendme-protocol" }
anyhow = "1.0.75"
iroh = "1.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
tokio = { version = "1.34.0", features = ["full"] }
url = "2"
