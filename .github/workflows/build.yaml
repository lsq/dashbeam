name: Windows CLI Build

on:
  push:
    branches:
      # - main
      # - dev
      - c_ffi
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write   # action-gh-release 需要

jobs:
  build-cli:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: amd64
            exe_suffix: x64
            cache_key: windows-x86_64
          - name: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64   # x64 主机交叉编译 arm64
            exe_suffix: arm64
            cache_key: windows-aarch64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './engine -> target'
          key: ${{ matrix.cache_key }}-cargo

      - name: Ensure Windows ARM64 target
        if: matrix.msvc_arch == 'amd64_arm64'
        shell: bash
        run: |
          set -eux
          rustup target add aarch64-pc-windows-msvc
          rustup target list --installed

      - name: Build dashbeam_ffi.dll (${{ matrix.rust_target }})
        run: |
          cargo build --manifest-path engine/Cargo.toml `
            -p dashbeam-ffi --release --target ${{ matrix.rust_target }}
        timeout-minutes: 30

      - name: Setup MSVC (${{ matrix.msvc_arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Compile dashbeam-send.exe
        run: |
          cl /std:c++17 /EHsc /utf-8 /O2 `
             /I engine\ffi\include `
             cli\dashbeam-send.cpp `
             engine\target\${{ matrix.rust_target }}\release\dashbeam_ffi.dll.lib `
             /Fe:dashbeam-send-${{ matrix.exe_suffix }}.exe

      - name: Stage artifacts
        run: |
          $d = "dist-${{ matrix.exe_suffix }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item "dashbeam-send-${{ matrix.exe_suffix }}.exe" "$d\dashbeam-send.exe"
          Copy-Item "engine\target\${{ matrix.rust_target }}\release\dashbeam_ffi.dll" "$d\"
          Copy-Item "engine\target\${{ matrix.rust_target }}\release\dashbeam_ffi.dll.lib" "$d\"
          Copy-Item "engine\ffi\include\dashbeam.h" "$d\"
          Compress-Archive -Path "$d\*" -DestinationPath "dashbeam-cli-${{ matrix.name }}.zip"
          Get-ChildItem $d, "dashbeam-cli-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: dashbeam-cli-${{ matrix.name }}
          path: dist-${{ matrix.exe_suffix }}/
          retention-days: 14

      - name: Setup upterm session
        if: failure()
        with:
          wait-timeout-minutes: 20
          detached: true
        uses: owenthereal/action-upterm@v2

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dashbeam-cli-${{ matrix.name }}.zip
          generate_release_notes: true
